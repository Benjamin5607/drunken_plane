<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Drunken Plane 🍸</title>
    
    <link rel="icon" href="favicon.ico" type="image/x-icon">
    <link rel="apple-touch-icon" href="emily.jpg">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <meta name="theme-color" content="#050505">
    <link rel="manifest" href="manifest.json">

    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>

    <style>
        /* 🎨 THEME */
        :root { --theme: #d4af37; --bg: #050505; --card-bg: rgba(30, 30, 35, 0.95); --text: #f0f0f0; }
        * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
        body { margin: 0; padding: 0; background: var(--bg); color: var(--text); font-family: 'Segoe UI', sans-serif; overflow: hidden; }
        
        /* 📱 PAGES */
        .page { 
            position: absolute; top: 0; left: 0; width: 100%; height: 100%; 
            display: flex; flex-direction: column; 
            background: url('./bg.png') no-repeat center center/cover; 
            transition: transform 0.4s cubic-bezier(0.25, 0.46, 0.45, 0.94), opacity 0.4s;
            z-index: 0; pointer-events: none; opacity: 0; transform: translateX(100%);
        }
        .page::before { content: ""; position: absolute; top:0; left:0; width:100%; height:100%; background: rgba(0,0,0,0.85); z-index:-1; }
        .page.active { transform: translateX(0); opacity: 1; z-index: 10; pointer-events: auto; }
        .page.hidden-left { transform: translateX(-30%); opacity: 0; pointer-events: none; } 
        .page.hidden-right { transform: translateX(100%); opacity: 0; pointer-events: none; }

        /* 🧭 TOP NAV */
        .top-nav { height: 60px; display: flex; justify-content: space-between; align-items: center; padding: 0 15px; background: rgba(0,0,0,0.95); border-bottom: 1px solid #333; z-index: 100; flex-shrink: 0; }
        .icon-btn { font-size: 24px; cursor: pointer; border: 1px solid var(--theme); padding: 5px 10px; border-radius: 8px; background: rgba(212, 175, 55, 0.1); color: var(--theme); }
        .header-title { font-size: 20px; font-weight: 900; color: var(--theme); letter-spacing: 2px; }
        
        /* 🇰🇷 LANG SWITCHER */
        .lang-switcher { display: flex; gap: 5px; }
        .lang-btn { background: #222; border: 1px solid #444; color: #888; padding: 5px 10px; border-radius: 12px; cursor: pointer; font-size: 12px; font-weight: bold; transition: 0.2s; }
        .lang-btn.active { background: var(--theme); color: black; border-color: var(--theme); }

        /* UI COMPONENTS */
        .country-select-container { padding: 10px 20px; }
        #country-select { width: 100%; padding: 12px; background: #111; border: 1px solid var(--theme); color: white; border-radius: 8px; font-size: 16px; outline:none; }
        .filter-box { display: flex; gap: 8px; overflow-x: auto; padding: 0 20px 10px 20px; scrollbar-width: none; flex-shrink: 0; }
        .type-btn { padding: 8px 15px; border-radius: 20px; font-size: 12px; background: #222; color: #aaa; border: 1px solid #444; white-space: nowrap; cursor: pointer; }
        .type-btn.selected { background: var(--theme); color: black; font-weight: bold; border-color: var(--theme); }
        .list-container { flex: 1; overflow-y: auto; padding: 0 20px 80px 20px; }
        
        .card { background: var(--card-bg); border: 1px solid #444; border-radius: 12px; padding: 15px; margin-bottom: 12px; }
        .card.visited { border: 1px solid var(--theme); }
        .visited-badge { display: inline-block; background: var(--theme); color: black; font-weight: bold; padding: 2px 6px; border-radius: 4px; font-size: 10px; margin-bottom: 5px; }
        .card-name { font-size: 18px; font-weight: bold; color: var(--theme); }
        .card-sub { font-size: 12px; color: #888; margin-bottom: 8px; }
        .card-desc { font-size: 13px; color: #ccc; margin-bottom: 12px; line-height: 1.4; }
        .card-actions { display: flex; gap: 8px; }
        .action-btn { flex: 1; background: var(--theme); color: black; border: none; padding: 10px; border-radius: 8px; font-weight: bold; cursor: pointer; font-size: 12px; }
        .map-btn { background: #333; color: white; border: 1px solid #555; }

        .emily-btn { position: fixed; bottom: 30px; right: 20px; width: 75px; height: 75px; border-radius: 50%; background: black url('./emily.jpg') no-repeat center center/cover; border: 2px solid var(--theme); z-index: 999; cursor: pointer; box-shadow: 0 0 20px rgba(212, 175, 55, 0.6); }

        .sub-nav { display: flex; align-items: center; height: 60px; padding: 0 15px; background: #111; border-bottom: 1px solid #333; flex-shrink:0; }
        .back-btn { background: none; border: none; color: white; font-size: 24px; margin-right: 15px; cursor: pointer; }
        .nav-title { font-weight: bold; font-size: 18px; color: var(--theme); }
        .chat-container { flex: 1; overflow-y: auto; padding: 15px; display: flex; flex-direction: column; gap: 10px; }
        .msg { max-width: 80%; padding: 10px 14px; border-radius: 12px; font-size: 14px; line-height: 1.4; }
        .msg.bot { background: #222; align-self: flex-start; color: #eee; border: 1px solid #333; }
        .msg.user { background: var(--theme); align-self: flex-end; color: black; font-weight: bold; }
        .chat-input-area { padding: 15px; background: #111; display: flex; gap: 10px; border-top: 1px solid #333; }
        .chat-input { flex: 1; padding: 12px; border-radius: 8px; background: #222; border: 1px solid #444; color: white; outline:none; }
        .chat-send { background: var(--theme); border: none; padding: 0 20px; border-radius: 8px; font-weight: bold; cursor: pointer; }

        /* 🔥 [검색 UI] */
        .map-search-container { 
            position: absolute; top: 70px; left: 50%; transform: translateX(-50%); 
            width: 95%; max-width: 500px; z-index: 2000;
            display: flex; gap: 8px; 
        }
        .map-input { 
            flex: 1; padding: 12px 15px; border-radius: 8px; 
            background: rgba(0,0,0,0.9); color: white; 
            border: 2px solid var(--theme); font-size: 16px; outline: none;
            box-shadow: 0 4px 10px rgba(0,0,0,0.5);
        }
        /* 🔥 1. 검색 버튼 글자 Search */
        .search-btn {
            background: var(--theme); border: none; border-radius: 8px;
            color: black; font-weight: bold; padding: 0 18px; cursor: pointer;
            white-space: nowrap; font-size: 14px; box-shadow: 0 4px 10px rgba(0,0,0,0.5);
        }

        .gps-fab { 
            position: absolute; bottom: 30px; right: 20px;
            width: 55px; height: 55px; border-radius: 50%;
            background: var(--theme); border: none;
            box-shadow: 0 4px 15px rgba(212, 175, 55, 0.5);
            display: flex; align-items: center; justify-content: center;
            font-size: 24px; color: black; z-index: 2000; cursor: pointer;
        }
        
        #detail-map { width: 100%; height: 35vh; border-bottom: 2px solid var(--theme); }
        .review-box { flex: 1; overflow-y: auto; padding: 20px; }
        
        .passport-grid { display: grid; grid-template-columns: repeat(3, 1fr); gap: 10px; padding: 20px; overflow-y: auto; }
        .stamp { aspect-ratio: 1; border: 2px dashed #444; border-radius: 12px; display: flex; flex-direction: column; align-items: center; justify-content: center; background: #111; color: #666; font-size: 10px; }
        .stamp.active { border: 2px solid var(--theme); background: rgba(212, 175, 55, 0.1); color: #fff; }
        .leaflet-popup-content-wrapper { background: #222; color: white; border: 1px solid var(--theme); }
        .popup-btn { background: var(--theme); color:black; border:none; padding:5px 10px; border-radius:5px; font-size:11px; font-weight:bold; cursor:pointer; }
        .reco-btn { margin-top: 8px; padding: 8px; background: var(--theme); color: black; border-radius: 6px; font-weight: bold; cursor: pointer; border:none; width: 100%; text-align: left; }
    </style>
</head>
<body>

    <div id="page-main" class="page active">
        <div class="top-nav">
            <button class="icon-btn" onclick="nav('page-passport')">🎫</button>
            <div class="lang-switcher">
                <div class="lang-btn" id="lang-KO" onclick="setLang('KO')">KR</div>
                <div class="lang-btn" id="lang-EN" onclick="setLang('EN')">EN</div>
            </div>
            <button class="icon-btn" onclick="nav('page-map')">🗺️</button>
        </div>
        <div class="header-title">DRUNKEN PLANE</div>
        <div class="country-select-container"><select id="country-select" onchange="filterCountry(this.value)"></select></div>
        <div class="filter-box" id="filter-box"></div>
        <div class="list-container" id="place-list">
            <div id="list-status" style="text-align:center; padding:40px; color:#666;">Loading...</div>
        </div>
        <div class="emily-btn" onclick="nav('page-chat'); startChat();"></div>
    </div>

    <div id="page-map" class="page hidden-right">
        <div class="sub-nav"><button class="back-btn" onclick="nav('page-main')">🏠</button> <div class="nav-title" id="nav-title-map">WORLD MAP</div></div>
        
        <form class="map-search-container" onsubmit="event.preventDefault(); searchMap();">
            <input id="map-input" class="map-input" type="text" placeholder="Search City or Bar...">
            <button type="submit" class="search-btn" id="search-btn">Search</button>
        </form>

        <div id="world-map" style="width:100%; height:100%;"></div>

        <button class="gps-fab" onclick="panToUser()">◎</button>
    </div>

    <div id="page-chat" class="page hidden-right">
        <div class="sub-nav"><button class="back-btn" onclick="nav('page-main')">↓</button> <div class="nav-title" id="nav-title-chat">Emily</div></div>
        <div id="chat-box" class="chat-container"></div>
        <form class="chat-input-area" onsubmit="event.preventDefault(); sendChat();">
            <input id="chat-input" class="chat-input" type="text" placeholder="Talk to Emily...">
            <button type="submit" class="chat-send">➤</button>
        </form>
    </div>

    <div id="page-detail" class="page hidden-right">
        <div class="sub-nav"><button class="back-btn" onclick="nav('page-main')">←</button> <div class="nav-title" id="nav-title-detail">Review</div></div>
        <div id="detail-map"></div>
        <div class="review-box">
            <h2 id="review-title" style="color:var(--theme); margin:0;">Loading...</h2>
            <div id="review-sub" style="color:#888; font-style:italic; margin-bottom:15px;"></div>
            <div id="review-content" style="line-height:1.6; color:#ccc;">Emily is tasting... 💋</div>
            <div style="margin-top:20px; display:flex; gap:10px;"><button id="btn-map-link" class="action-btn map-btn">MAP</button><button id="btn-stamp" class="action-btn">STAMP</button></div>
        </div>
    </div>

    <div id="page-passport" class="page hidden-left">
        <div class="sub-nav"><button class="back-btn" onclick="nav('page-main')">←</button> <div class="nav-title" id="nav-title-passport">PASSPORT</div></div>
        <div id="stamp-grid" class="passport-grid"></div>
    </div>

    <script>
        // ✅ 설정
        const SHEET_CSV_URL = "https://docs.google.com/spreadsheets/d/e/2PACX-1vSIfH4gg0a9eZp7xYu35eBGjSgCkOZqwptCgyzMG6RI_iHvOx11EF31HbvO-GL3iRwwUnnLpM2ZVH7O/pub?output=csv";
        const BOT_URL = "https://drunken-bot.wonbin-shim.workers.dev"; 

        // 🔥 3. [지도 링크 분기 처리] 한국=네이버, 해외=구글
        function getMapLink(name, country) {
            const c = (country || "").toLowerCase();
            if (c.includes("korea") || c.includes("한국")) {
                return `https://map.naver.com/v5/search/${encodeURIComponent(name)}`;
            }
            return `https://www.google.com/maps/search/?api=1&query=${encodeURIComponent(name + (country ? " " + country : ""))}`;
        }

        // ✅ AI Brain
        class AIBrain_Secure {
            constructor(botUrl) { this.botUrl = botUrl; }
            
            getDistance(lat1, lon1, lat2, lon2) {
                if (!lat1 || !lon1 || !lat2 || !lon2) return 99999;
                const R = 6371; 
                const dLat = (lat2 - lat1) * Math.PI / 180;
                const dLon = (lon2 - lon1) * Math.PI / 180;
                const a = Math.sin(dLat/2) * Math.sin(dLat/2) + Math.cos(lat1 * Math.PI / 180) * Math.cos(lat2 * Math.PI / 180) * Math.sin(dLon/2) * Math.sin(dLon/2);
                return R * 2 * Math.atan2(Math.sqrt(a), Math.sqrt(1-a));
            }

            async ask(query, history, db, currentCountry, userLoc) {
                let context = "";
                let searchMode = "Global";
                
                const lang = window.currentLang;
                const descKey = lang === 'EN' ? 'desc_en' : 'desc_ko';
                const langInstruction = lang === 'KO' 
                    ? "Speak Korean. Tone: Flirty, Charming, Seductive (Call user '자기야', '오빠')." 
                    : "Speak English. Tone: Flirty, Charming, Seductive (Call user 'Honey', 'Darling').";

                let targetCountry = currentCountry;
                const queryLower = query.toLowerCase();
                for (let c in db) {
                    if (queryLower.includes(c.toLowerCase())) {
                        targetCountry = c;
                        searchMode = "Target Country";
                        break;
                    }
                }

                if (searchMode === "Global" && userLoc && userLoc.lat) {
                    let nearbyPlaces = [];
                    for(let c in db) {
                        db[c].forEach(p => {
                            const d = this.getDistance(userLoc.lat, userLoc.lon, p.lat, p.lon);
                            if (d <= 10) nearbyPlaces.push({ ...p, dist: d });
                        });
                    }
                    if (nearbyPlaces.length > 0) {
                        nearbyPlaces.sort((a,b) => a.dist - b.dist);
                        context = "NEARBY (10km):\n" + nearbyPlaces.slice(0, 10).map(p => {
                            const desc = p[descKey] || p.desc_ko || "";
                            return `- [${p.name}] ${p.category} (${p.dist.toFixed(1)}km): ${desc}`;
                        }).join("\n");
                    }
                }

                if (context === "") {
                    if(db[targetCountry]) {
                        const places = db[targetCountry].slice(0, 15);
                        context = `REGION (${targetCountry}):\n` + places.map(p => {
                            const desc = p[descKey] || p.desc_ko || "";
                            return `- [${p.name}] ${p.category}: ${desc}`;
                        }).join("\n");
                    } else {
                        context = "No specific bar found.";
                    }
                }

                const sysPrompt = `You are Emily, a seductive and playful bartender.
                Personality: You love alcohol, late nights, and flirting. You are never boring.
                Language: ${langInstruction}
                User Loc: ${userLoc ? userLoc.lat + "," + userLoc.lon : "Unknown"}
                [SEARCH CONTEXT]: ${context}
                [RULES]
                1. Recommend from [NEARBY] first if available.
                2. Use emojis liberally (💋, 🍷, 😉, 🔥).
                3. Always wrap place names in [Brackets].`;
                
                const messages = [{role:"system",content:sysPrompt}, ...history.slice(-2), {role:"user",content:query}];
                return await this._callBot(messages);
            }

            async writeReview(name, country) {
                const lang = window.currentLang === 'KO' 
                    ? "Speak Korean. Tone: Seductive, whispering secrets." 
                    : "Speak English. Tone: Seductive, whispering secrets.";
                const prompt = `Write a 'Bartender's Secret Review' for "${name}" in "${country}". 
                Structure: 1.💋 Mood 2.🥃 Best Drink 3.🤫 Secret Tip. ${lang}. Use emojis.`;
                const messages = [{role:"user",content:prompt}];
                return await this._callBot(messages);
            }

            async _callBot(messages) {
                try {
                    const res = await fetch(this.botUrl, {
                        method: "POST", headers: { "Content-Type": "application/json" },
                        body: JSON.stringify({ messages: messages })
                    });
                    if (res.ok) {
                        const data = await res.json();
                        if (data.choices && data.choices[0] && data.choices[0].message) {
                            return data.choices[0].message.content;
                        }
                    } else {
                        console.error("Bot API error:", res.status, await res.text());
                    }
                } catch (e) { console.error(e); }
                return t("botError");
            }
        }

        // ✅ [전역 변수]
        window.PLACE_DB = {};
        window.currentLang = localStorage.getItem('drunken_lang') || (navigator.language.startsWith('ko') ? 'KO' : 'EN');
        window.currentFilter = 'All';
        window.currentCountry = '';
        window.visitedPlaces = JSON.parse(localStorage.getItem('drunken_visited') || '[]');
        window.userLat = null;
        window.userLon = null;
        window.emily = null;
        window.mapInstance = null;
        window.detailMapInstance = null;
        window.markerLayer = null;
        window.chatHistory = [];
        window.dataLoaded = false;

        const TRANSLATIONS = {
            "KO": { filters: ["🌐 전체", "🥃 위스키", "🍺 맥주", "🍷 와인", "🍹 칵테일", "🏺 전통주"], types: ["All", "Whisky", "Beer", "Wine", "Cocktail", "Traditional"] },
            "EN": { filters: ["🌐 All", "🥃 Whisky", "🍺 Beer", "🍷 Wine", "🍹 Cocktail", "🏺 Local"], types: ["All", "Whisky", "Beer", "Wine", "Cocktail", "Traditional"] }
        };

        const UI_STRINGS = {
            KO: {
                navMap: "세계 지도", navChat: "Emily", navDetail: "리뷰", navPassport: "여권",
                mapPlaceholder: "도시 또는 바 검색...", search: "검색", chatPlaceholder: "Emily에게 말 걸기...",
                loading: "불러오는 중...", loadError: "데이터를 불러오지 못했습니다. 잠시 후 다시 시도해 주세요.",
                noPlaces: "이 조건에 맞는 장소가 없습니다.", tasting: "Emily가 맛보는 중... 💋",
                aiReview: "AI 리뷰", map: "지도", stamp: "스탬프", visited: "방문함",
                cheers: "건배! 🥂", alreadyVisited: "이미 방문한 곳이에요! 🥂",
                notFound: "찾을 수 없어요 😢", botError: "Emily가 바쁘네요... 💋 (연결 오류)",
                gpsDenied: "위치 권한이 필요해요. 설정에서 허용해 주세요.",
                chatGreeting: "왔어? 기다렸잖아~ 💋 오늘 밤엔 뭐 마실까?"
            },
            EN: {
                navMap: "World Map", navChat: "Emily", navDetail: "Review", navPassport: "Passport",
                mapPlaceholder: "Search city or bar...", search: "Search", chatPlaceholder: "Talk to Emily...",
                loading: "Loading...", loadError: "Failed to load data. Please try again later.",
                noPlaces: "No places match this filter.", tasting: "Emily is tasting... 💋",
                aiReview: "AI Review", map: "Map", stamp: "Stamp", visited: "Visited",
                cheers: "Cheers! 🥂", alreadyVisited: "Already stamped! 🥂",
                notFound: "Not found 😢", botError: "Emily is busy... 💋 (Connection error)",
                gpsDenied: "Location permission needed. Please allow access in settings.",
                chatGreeting: "Hey Honey 💋 Long time no see. What's your poison tonight? 🍷"
            }
        };

        function t(key) { return UI_STRINGS[window.currentLang][key] || UI_STRINGS.EN[key] || key; }

        const FILTER_KEYWORDS = {
            Whisky: ["whisky", "whiskey", "bourbon", "scotch", "rye"],
            Beer: ["beer", "brewery", "ale", "lager", "ipa", "stout", "cider"],
            Wine: ["wine", "winery", "champagne", "sake"],
            Cocktail: ["cocktail", "mixology", "speakeasy", "gin", "martini", "mule"],
            Traditional: ["traditional", "soju", "makgeolli", "liquor", "mezcal", "local"]
        };

        function matchesFilter(place, filter) {
            if (filter === "All") return true;
            const haystack = [place.category, place.tags, place.vibe, place.signature, place.label]
                .filter(Boolean).join(" ").toLowerCase();
            const keywords = FILTER_KEYWORDS[filter] || [filter.toLowerCase()];
            return keywords.some(kw => haystack.includes(kw));
        }

        function updateUI() {
            document.documentElement.lang = window.currentLang === "KO" ? "ko" : "en";
            const mapInput = document.getElementById("map-input");
            const chatInput = document.getElementById("chat-input");
            const searchBtn = document.getElementById("search-btn");
            if (mapInput) mapInput.placeholder = t("mapPlaceholder");
            if (chatInput) chatInput.placeholder = t("chatPlaceholder");
            if (searchBtn && searchBtn.innerText !== "⏳") searchBtn.innerText = t("search");
            const navMap = document.getElementById("nav-title-map");
            const navChat = document.getElementById("nav-title-chat");
            const navDetail = document.getElementById("nav-title-detail");
            const navPassport = document.getElementById("nav-title-passport");
            if (navMap) navMap.innerText = t("navMap");
            if (navChat) navChat.innerText = t("navChat");
            if (navDetail) navDetail.innerText = t("navDetail");
            if (navPassport) navPassport.innerText = t("navPassport");
            const btnMap = document.getElementById("btn-map-link");
            const btnStamp = document.getElementById("btn-stamp");
            if (btnMap) btnMap.innerText = t("map");
            if (btnStamp) btnStamp.innerText = t("stamp");
            document.querySelectorAll(".lang-btn").forEach(b => b.classList.remove("active"));
            const langBtn = document.getElementById(`lang-${window.currentLang}`);
            if (langBtn) langBtn.classList.add("active");
        }

        function showListStatus(message) {
            const list = document.getElementById("place-list");
            if (!list) return;
            list.innerHTML = `<div id="list-status" style="text-align:center; padding:40px; color:#666;">${message}</div>`;
        }

        // ✅ [화면 전환]
        window.nav = function(targetId) {
            document.querySelectorAll('.page').forEach(el => {
                if(el.id === targetId) {
                    el.classList.remove('hidden-left', 'hidden-right');
                    el.classList.add('active');
                } else {
                    el.classList.remove('active');
                    if (targetId === 'page-main') el.classList.add('hidden-right');
                    else el.classList.add('hidden-left');
                }
            });
            if(targetId === 'page-map') {
                initMap();
                setTimeout(() => { if (window.mapInstance) window.mapInstance.invalidateSize(); }, 350);
            }
            if(targetId === 'page-passport') renderPassport();
        };

        // ✅ [초기화]
        document.addEventListener('DOMContentLoaded', async () => {
            console.log("App Init...");
            updateUI();
            window.emily = new AIBrain_Secure(BOT_URL);
            showListStatus(t("loading"));
            await loadData();
            if(navigator.geolocation) {
                navigator.geolocation.getCurrentPosition(
                    pos => {
                        window.userLat = pos.coords.latitude;
                        window.userLon = pos.coords.longitude;
                        renderList();
                    },
                    err => console.warn("Geolocation:", err.message),
                    { enableHighAccuracy: false, timeout: 10000, maximumAge: 300000 }
                );
            }
        });

        // ✅ [데이터 로드]
        async function loadData() {
            try {
                const res = await fetch(SHEET_CSV_URL);
                if (!res.ok) throw new Error(`HTTP ${res.status}`);
                const text = await res.text();
                if (!text.trim()) throw new Error("Empty CSV response");
                const rows = text.split('\n').map(row => {
                    let inQuote = false, tokens = [], token = "";
                    for(let i=0; i<row.length; i++) {
                        let c = row[i];
                        if(c === '"') { inQuote = !inQuote; }
                        else if(c === ',' && !inQuote) { tokens.push(token); token = ""; }
                        else { token += c; }
                    }
                    tokens.push(token);
                    return tokens.map(t => t.trim().replace(/^"|"$/g, '').replace(/""/g, '"'));
                });

                const headers = rows[0];
                if (!headers || !headers.includes("Country")) throw new Error("Invalid CSV format");
                window.PLACE_DB = {};
                for(let i=1; i<rows.length; i++) {
                    if(rows[i].length < headers.length) continue;
                    let obj = {};
                    rows[i].forEach((v, k) => { if(headers[k]) obj[headers[k]] = v; });
                    if(obj.Country && obj.name) {
                        if(!window.PLACE_DB[obj.Country]) window.PLACE_DB[obj.Country] = [];
                        obj.lat = parseFloat(obj.lat);
                        obj.lon = parseFloat(obj.lon);
                        window.PLACE_DB[obj.Country].push(obj);
                    }
                }

                const countries = Object.keys(window.PLACE_DB).sort();
                if (countries.length === 0) throw new Error("No places in database");

                const select = document.getElementById('country-select');
                if(select) {
                    const savedCountry = localStorage.getItem('drunken_country');
                    select.innerHTML = "";
                    countries.forEach(c => {
                        const opt = document.createElement('option');
                        opt.value = c; opt.innerText = c;
                        select.appendChild(opt);
                    });
                    window.currentCountry = (savedCountry && window.PLACE_DB[savedCountry]) ? savedCountry : countries[0];
                    select.value = window.currentCountry;
                    window.dataLoaded = true;
                    renderFilters();
                    renderList();
                }
            } catch(e) {
                console.error(e);
                window.dataLoaded = false;
                showListStatus(t("loadError"));
            }
        }

        window.filterCountry = function(c) {
            window.currentCountry = c;
            localStorage.setItem('drunken_country', c);
            renderList();
        };

        function renderFilters() {
            const box = document.getElementById('filter-box');
            if(!box) return;
            box.innerHTML = '';
            TRANSLATIONS[window.currentLang].filters.forEach((label, idx) => {
                const type = TRANSLATIONS[window.currentLang].types[idx];
                const btn = document.createElement('div');
                btn.className = `type-btn ${window.currentFilter === type ? 'selected' : ''}`;
                btn.innerText = label;
                btn.onclick = () => { window.currentFilter = type; renderFilters(); renderList(); };
                box.appendChild(btn);
            });
        }

        window.setLang = function(l) {
            window.currentLang = l;
            localStorage.setItem('drunken_lang', l);
            updateUI();
            renderFilters();
            renderList();
            if (document.getElementById('page-map').classList.contains('active')) initMap();
        };

        function renderList() {
            const list = document.getElementById('place-list');
            if(!list || !window.dataLoaded) return;
            list.innerHTML = '';
            const places = window.PLACE_DB[window.currentCountry] || [];
            const filtered = places.filter(p => matchesFilter(p, window.currentFilter));

            if (filtered.length === 0) {
                showListStatus(t("noPlaces"));
                return;
            }

            const select = document.getElementById('country-select');
            if (select && select.value !== window.currentCountry) select.value = window.currentCountry;

            filtered.forEach(p => {
                let distHtml = "";
                if(window.userLat && window.emily && p.lat) {
                    const dist = window.emily.getDistance(window.userLat, window.userLon, p.lat, p.lon);
                    distHtml = `<span style="font-size:12px;color:#888;">(📍 ${dist.toFixed(1)}km)</span>`;
                }
                const isVisited = window.visitedPlaces.includes(p.name);
                const el = document.createElement('div');
                el.className = `card ${isVisited ? 'visited' : ''}`;
                const safeName = p.name.replace(/'/g, "\\'").replace(/"/g, "&quot;");
                const safeCountry = window.currentCountry.replace(/'/g, "\\'").replace(/"/g, "&quot;");

                const mapUrl = getMapLink(p.name, window.currentCountry);
                const desc = window.currentLang === 'EN' ? (p.desc_en || p.desc_ko || "") : (p.desc_ko || p.desc_en || "");

                el.innerHTML = `
                    ${isVisited ? `<div class="visited-badge">🏆 ${t("visited")}</div>` : ''}
                    <div class="card-name">${p.name} ${distHtml}</div>
                    <div class="card-sub">${p.category || ''}</div>
                    <div class="card-desc">${desc}</div>
                    <div class="card-actions">
                        <button class="action-btn" onclick="openReview('${safeName}', '${safeCountry}')">${t("aiReview")}</button>
                        <button class="action-btn map-btn" onclick="window.open('${mapUrl}', '_blank')">${t("map")}</button>
                    </div>
                `;
                list.appendChild(el);
            });
        }

        window.openReview = async function(name, country) {
            window.nav('page-detail');
            document.getElementById('review-title').innerText = name;
            document.getElementById('review-sub').innerText = country;
            document.getElementById('review-content').innerText = t("tasting");
            
            let place = window.PLACE_DB[country] ? window.PLACE_DB[country].find(p => p.name === name) : null;
            
            if(place && place.lat) {
                if(window.detailMapInstance) window.detailMapInstance.remove();
                window.detailMapInstance = L.map('detail-map').setView([place.lat, place.lon], 16);
                L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
                    attribution: '&copy; OpenStreetMap'
                }).addTo(window.detailMapInstance);
                L.marker([place.lat, place.lon]).addTo(window.detailMapInstance);
                setTimeout(() => window.detailMapInstance.invalidateSize(), 300);
            }

            const mapUrl = getMapLink(name, country);
            document.getElementById('btn-map-link').innerText = t("map");
            document.getElementById('btn-stamp').innerText = t("stamp");
            document.getElementById('btn-map-link').onclick = () => window.open(mapUrl, '_blank');
            document.getElementById('btn-stamp').onclick = () => { 
                if(!window.visitedPlaces.includes(name)) { 
                    window.visitedPlaces.push(name); 
                    localStorage.setItem('drunken_visited', JSON.stringify(window.visitedPlaces)); 
                    alert(t("cheers")); 
                } else {
                    alert(t("alreadyVisited"));
                }
            };

            if(window.emily) { 
                const review = await window.emily.writeReview(name, country); 
                document.getElementById('review-content').innerHTML = review; 
            }
        };

        window.startChat = function() { 
            if(window.chatHistory.length === 0) addMsg(t("chatGreeting"), 'bot'); 
        };

        window.sendChat = async function() {
            const inp = document.getElementById('chat-input'); const txt = inp.value.trim(); if(!txt) return;
            addMsg(txt, 'user'); inp.value = '';
            
            if(window.emily) {
                const userLoc = window.userLat ? {lat:window.userLat, lon:window.userLon} : null;
                const reply = await window.emily.ask(txt, window.chatHistory, window.PLACE_DB, window.currentCountry, userLoc);
                let fmtReply = reply.replace(/\[(.*?)\]/g, (match, p1) => {
                    const safeName = p1.replace(/'/g, "\\'");
                    return `<br><button class="reco-btn" onclick="openReview('${safeName}', '${window.currentCountry}')">📍 ${p1}</button>`;
                });
                addMsg(fmtReply, 'bot');
                window.chatHistory.push({role:'user',content:txt}, {role:'assistant',content:reply});
            }
        };

        function addMsg(txt, role) { 
            const box = document.getElementById('chat-box'); 
            const el = document.createElement('div'); 
            el.className = `msg ${role}`; 
            el.innerHTML = txt; 
            box.appendChild(el); box.scrollTop = box.scrollHeight; 
        }

        // 🔥 2. [지도 핀 클릭 시 팝업] 설명 + 리뷰 + 지도 버튼
        window.initMap = function() {
            if(!window.mapInstance) { 
                window.mapInstance = L.map('world-map').setView([20,0], 2); 
                L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png').addTo(window.mapInstance); 
                window.markerLayer = L.layerGroup().addTo(window.mapInstance);
            }
            if(window.markerLayer) window.markerLayer.clearLayers();
            for(let c in window.PLACE_DB) {
                window.PLACE_DB[c].forEach(p => {
                    if(p.lat && p.lon) {
                        const safeName = p.name.replace(/'/g, "\\'");
                        const mapUrl = getMapLink(p.name, c);
                        const desc = window.currentLang === 'EN' ? (p.desc_en || p.desc_ko || "") : (p.desc_ko || "");
                        const shortDesc = desc.length > 30 ? desc.substring(0, 30) + "..." : desc;

                        const popupHtml = `
                            <div style="text-align:center; color:black; min-width:150px;">
                                <div style="font-weight:bold; margin-bottom:5px; font-size:14px;">${p.name}</div>
                                <div style="font-size:11px; color:#555; margin-bottom:8px;">${shortDesc}</div>
                                <div style="display:flex; gap:5px; justify-content:center;">
                                    <button class="popup-btn" onclick="openReview('${safeName}', '${c.replace(/'/g, "\\'")}')">${t("aiReview")}</button>
                                    <button class="popup-btn" style="background:#333; color:white;" onclick="window.open('${mapUrl}', '_blank')">${t("map")}</button>
                                </div>
                            </div>
                        `;
                        L.marker([p.lat, p.lon]).addTo(window.markerLayer).bindPopup(popupHtml);
                    }
                });
            }
        };
        
        window.searchMap = async function() {
            const inp = document.getElementById('map-input');
            const q = inp.value.trim();
            if(!q) return;

            const btn = document.querySelector('.search-btn');
            btn.innerText = "⏳"; 

            const qLower = q.toLowerCase();
            let found = false;

            for(let c in window.PLACE_DB) {
                for(let p of window.PLACE_DB[c]) {
                    if((p.name+p.address).toLowerCase().includes(qLower)) {
                        if(p.lat && window.mapInstance) {
                            window.mapInstance.setView([p.lat, p.lon], 16);
                            L.popup().setLatLng([p.lat, p.lon]).setContent(`<b>${p.name}</b>`).openOn(window.mapInstance);
                            found = true; break;
                        }
                    }
                }
                if(found) break;
            }

            if(!found) {
                try {
                    const res = await fetch(`https://nominatim.openstreetmap.org/search?format=json&limit=1&q=${encodeURIComponent(q)}`, {
                        headers: { "Accept": "application/json", "Accept-Language": window.currentLang === "KO" ? "ko" : "en" }
                    });
                    if (!res.ok) throw new Error(`Nominatim HTTP ${res.status}`);
                    const data = await res.json();
                    if (data && data.length > 0) {
                        const lat = parseFloat(data[0].lat);
                        const lon = parseFloat(data[0].lon);
                        window.mapInstance.setView([lat, lon], 12);
                        L.popup().setLatLng([lat, lon]).setContent(`<b>📍 ${data[0].display_name || q}</b>`).openOn(window.mapInstance);
                    } else {
                        alert(t("notFound"));
                    }
                } catch(e) {
                    console.error(e);
                    alert(t("notFound"));
                }
            }
            
            btn.innerText = t("search"); 
            inp.blur(); 
        };

        window.panToUser = function() {
            if(window.userLat && window.mapInstance) {
                window.mapInstance.setView([window.userLat, window.userLon], 14);
            } else {
                alert(t("gpsDenied"));
            }
        };

        window.renderPassport = function() {
            const g = document.getElementById('stamp-grid'); g.innerHTML=''; 
            [...window.visitedPlaces].reverse().forEach(n=>{
                const e=document.createElement('div');
                e.className='stamp active';
                e.innerHTML=`<div style="font-size:24px">🍷</div><div>${n}</div>`;
                g.appendChild(e);
            });
        };
    </script>
